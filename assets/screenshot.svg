<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="system-ui,Segoe UI,Helvetica,sans-serif">
  <rect width="820" height="470" fill="#0f1117"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="210" height="470" fill="#11151c"/>
  <rect x="12" y="16" width="140" height="30" rx="8" fill="#0b0d12" stroke="#222a36"/><text x="24" y="36" font-size="12" fill="#6e7681">Search…</text>
  <rect x="160" y="16" width="38" height="30" rx="8" fill="#6366f1"/><text x="179" y="38" font-size="18" fill="#fff" text-anchor="middle">+</text>
  <rect x="8" y="58" width="194" height="34" rx="8" fill="#1b2230"/><text x="22" y="80" font-size="12.5" fill="#818cf8">Welcome</text>
  <text x="22" y="116" font-size="12.5" fill="#c9d1d9">Grocery list</text>
  <text x="22" y="148" font-size="12.5" fill="#c9d1d9">Meeting notes</text>
  <text x="22" y="180" font-size="12.5" fill="#c9d1d9">Project ideas</text>
  <!-- editor -->
  <rect x="210" y="0" width="305" height="470" fill="#0f1117"/>
  <line x1="515" y1="0" x2="515" y2="470" stroke="#222a36"/>
  <text font-size="12.5" font-family="ui-monospace,monospace" xml:space="preserve">
    <tspan x="232" y="40" fill="#9aa4b2"># Welcome</tspan>
    <tspan x="232" y="76" fill="#c9d1d9">Offline-first **markdown** notes.</tspan>
    <tspan x="232" y="108" fill="#c9d1d9">- saved to `IndexedDB`</tspan>
    <tspan x="232" y="130" fill="#c9d1d9">- works with no network</tspan>
    <tspan x="232" y="152" fill="#c9d1d9">- installable as an app</tspan>
    <tspan x="232" y="184" fill="#c9d1d9">Type here…</tspan><tspan fill="#6366f1">|</tspan>
  </text>
  <!-- preview -->
  <text x="535" y="42" font-size="22" font-weight="800" fill="#e6edf3">Welcome</text>
  <text x="535" y="74" font-size="13.5" fill="#c9d1d9">Offline-first <tspan font-weight="700">markdown</tspan> notes.</text>
  <g font-size="13.5" fill="#c9d1d9">
    <circle cx="542" cy="100" r="3" fill="#6366f1"/><text x="556" y="105">saved to <tspan font-family="monospace" fill="#a5d6ff">IndexedDB</tspan></text>
    <circle cx="542" cy="126" r="3" fill="#6366f1"/><text x="556" y="131">works with no network</text>
    <circle cx="542" cy="152" r="3" fill="#6366f1"/><text x="556" y="157">installable as an app</text>
  </g>
  <!-- offline badge -->
  <rect x="535" y="400" width="250" height="48" rx="10" fill="#11151c" stroke="#222a36"/>
  <circle cx="557" cy="424" r="6" fill="#22c55e"/>
  <text x="572" y="420" font-size="12.5" fill="#e6edf3">Service worker active</text>
  <text x="572" y="436" font-size="11" fill="#9aa4b2">cached · offline-ready · ✓ 8 tests</text>
  <text x="232" y="450" font-size="11.5" fill="#3fb950" font-family="SFMono-Regular,monospace">IndexedDB + injectable backend → tested without a browser</text>
</svg>
